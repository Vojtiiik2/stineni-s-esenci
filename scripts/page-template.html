<!doctype html>
<html lang="{{LANG}}">
<head>
  <base href="/">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

  <title>{{TITLE}}</title>
  <meta name="description" content="{{DESCRIPTION}}">
  <link rel="canonical" href="{{URL}}">
  <link rel="alternate" hreflang="cs" href="{{CS_URL}}">
  <link rel="alternate" hreflang="en" href="{{EN_URL}}">
  <link rel="alternate" hreflang="x-default" href="{{CS_URL}}">
  <script type="application/ld+json">{{SCHEMA}}</script>
  <noscript><style>.reveal{opacity:1!important;transform:none!important}</style></noscript>
  <meta name="theme-color" content="#efe7de" />

  <link rel="icon" href="/assets/img/logo/Logo-symbol.svg" type="image/svg+xml">

  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="https://stinenisesenci.cz/assets/img/og-image-v3.webp">
<meta property="og:image:secure_url" content="https://stinenisesenci.cz/assets/img/og-image-v3.webp">
<meta property="og:image:type" content="image/webp">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="{{URL}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://stinenisesenci.cz/assets/img/og-image-v3.webp">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">

  <!-- Preload klíčových assetů -->
  <link rel="preload" as="image" href="assets/img/hero/hero-01.webp">
  <link rel="preload" as="image" href="assets/img/logo/Logo-symbol.svg" type="image/svg+xml">

  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="root">{{CONTENT}}</div>

  <script src="/assets/vendor/react-18.3.1.min.js" crossorigin defer></script>
  <script src="/assets/vendor/react-dom-18.3.1.min.js" crossorigin defer></script>
  <script src="./i18n/i18n.js" defer></script>
  <script src="./app.compiled.js" defer></script>
</body>
</html>
